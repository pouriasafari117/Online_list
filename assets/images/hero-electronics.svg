<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" fill="none">
  <defs>
    <linearGradient id="shell" x1="245" y1="88" x2="528" y2="385" gradientUnits="userSpaceOnUse"><stop stop-color="#f3eadc"/><stop offset=".48" stop-color="#c9b298"/><stop offset="1" stop-color="#80664f"/></linearGradient>
    <linearGradient id="screen" x1="270" y1="112" x2="504" y2="343" gradientUnits="userSpaceOnUse"><stop stop-color="#213b35"/><stop offset=".55" stop-color="#1a2e31"/><stop offset="1" stop-color="#111d22"/></linearGradient>
    <linearGradient id="phone" x1="150" y1="145" x2="309" y2="416" gradientUnits="userSpaceOnUse"><stop stop-color="#f8f0e3"/><stop offset="1" stop-color="#b99b79"/></linearGradient>
    <linearGradient id="phoneScreen" x1="174" y1="165" x2="285" y2="385" gradientUnits="userSpaceOnUse"><stop stop-color="#8fe3b0"/><stop offset=".48" stop-color="#269b83"/><stop offset="1" stop-color="#174d4a"/></linearGradient>

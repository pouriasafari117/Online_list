name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project
        run: node tools/verify.mjs

      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is enabled ✔"
          else
            echo "::error title=GitHub Pages is off::Settings → Pages → Build and deployment → Source: **GitHub Actions** (one click), then re-run this workflow."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # If the token is allowed to create the site (org repos), do it here;
          # user-owned repos need the one-click step above.
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifact
        run: |
          mkdir -p _site
          # setup/ is deliberately NOT published: it is a one-time, local-only page
          # (it can write data/vault.json, so it must never be public). Run
          # `npm start` and open http://localhost:8080/setup/ instead.
          cp -r index.html 404.html sw.js manifest.webmanifest robots.txt assets data _site/
          echo "Built $(find _site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# GitHub Pages (Jekyll) build settings.
# ---------------------------------------------------------------------------
# The site is plain static HTML and needs no plugins. Pages builds it with
# Jekyll when the source is "Deploy from a branch"; these excludes keep
# private/tooling files off the public site — most importantly `setup/`,
# which is able to write data/vault.json.
#
# When Pages uses "GitHub Actions" (recommended), .github/workflows/pages.yml
# copies an explicit allow-list instead and this file is simply ignored.
#
# Do NOT add a .nojekyll file: without Jekyll, `exclude` is ignored and the
# setup page would be published again. tools/verify.mjs enforces both rules.

title: Online List
description: لیست موجودی فروشگاه — بدون سرور و بدون دیتابیس
lang: fa

exclude:
  - setup
  - tools
  - docs
  - .github
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - THIRD-PARTY.md
  - LICENSE
  - _config.yml
  - Gemfile
  - Gemfile.lock

plugins: []
